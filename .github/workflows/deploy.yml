name: Build and Deploy

on:
  push:
    branches: [ main ]

# Ensure the Actions runtime uses Node 24 for JavaScript actions to avoid deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies if present
        run: |
          if [ -f package.json ] && grep -q '"dependencies"\|"devDependencies"' package.json; then
            echo "Dependencies detected — running npm ci"
            npm ci
          else
            echo "No dependencies found in package.json — skipping npm ci"
          fi

      - name: Set Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build or copy site
        run: |
          echo "Attempting npm run build if present"
          npm run build --if-present
          if [ -d out ]; then
            echo "out/ exists"
          elif [ -d site-src ]; then
            echo "site-src found, copying to out/"
            rm -rf out && mkdir -p out && cp -a site-src/. out/
            echo "Copied site-src -> out"
          else
            echo "No build output (out/) and no site-src. Nothing to publish."
          fi

      - name: Ensure out/.nojekyll
        run: mkdir -p out && touch out/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./out
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
